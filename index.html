<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Park Jihun — 만들고 있는 것들</title>
<meta name="description" content="오프보이스(오프라인 한국어 STT)와 데일리체크(생활·디지털 문제 해결 블로그)를 만들고 운영합니다.">
<link rel="canonical" href="https://jhtop101.github.io/">
<style>
  :root {
    color-scheme: light;
    --bg: #fff8ea;
    --panel: #ffffff;
    --ink: #332c22;
    --muted: #6f6557;
    --line: #e5d6bd;
    --green: #5f8b45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
          "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 16px 72px; }
  header { margin-bottom: 36px; }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0; }
  h2 {
    font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 40px 0 14px; font-weight: 600;
  }
  .card {
    display: block; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 12px;
    text-decoration: none; color: inherit;
  }
  .card:hover { border-color: var(--green); }
  .card b { display: block; font-size: 17px; margin-bottom: 4px; }
  .card span { color: var(--muted); font-size: 14.5px; display: block; }
  .card em { font-style: normal; color: var(--green); font-size: 13px; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { margin-bottom: 8px; }
  ul.plain a { color: var(--green); }
  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 14px;
  }
  footer a { color: var(--green); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Park Jihun</h1>
    <p class="lede">만들고 운영하는 것들을 모아 둔 곳입니다.</p>
  </header>

  <h2>운영 중인 사이트</h2>

  <a class="card" href="https://offvoice.kr/">
    <b>오프보이스</b>
    <span>인터넷 연결 없이 한국어 음성·영상을 텍스트로 변환하는 STT 프로그램입니다.
    녹취록·회의록·화자 분리를 기기 안에서 처리합니다.</span>
    <em>offvoice.kr</em>
  </a>

  <a class="card" href="https://dailycheck.kr/">
    <b>데일리체크</b>
    <span>스마트폰·앱 문제 해결과 행정·공공 서비스 이용 방법을 정리하는 블로그입니다.
    공식 출처의 수치를 직접 확인해 적습니다.</span>
    <em>dailycheck.kr</em>
  </a>

  <h2>앱 문서</h2>
  <ul class="plain">
    <li><a href="./privacy-policy.html">Pocket Block Garden 개인정보처리방침</a></li>
  </ul>

  <footer>
    GitHub <a href="https://github.com/jhtop101">@jhtop101</a>
  </footer>

</div>
</body>
</html>
